<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS Quiz Arena</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f5fb; display: flex; justify-content: center; padding: 20px; }
  main { width: 100%; max-width: 600px; }
  .card { background: #fff; border: 1px solid #ccd; border-radius: 10px; padding: 20px; }
  .top { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .bar { height: 8px; background: #dde; border-radius: 4px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #3b4cca; transition: width .3s; }
  #timer.low { color: red; }
  .opt { display: block; width: 100%; text-align: left; font-size: 1rem; padding: 12px; margin-bottom: 10px; border: 2px solid #ccd; border-radius: 8px; background: #fff; cursor: pointer; }
  .opt:hover:not(:disabled) { border-color: #3b4cca; }
  .opt.correct { background: #dff5e8; border-color: #1f9d55; }
  .opt.wrong { background: #fbe2e2; border-color: #d64545; }
  .exp { background: #eef; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
  button.btn { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 6px; background: #3b4cca; color: #fff; cursor: pointer; }
  .item { border-top: 1px solid #ccd; padding: 10px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>JS Quiz Arena</h1>

  <div id="quiz" class="card">
    <div class="top">
      <span id="progress"></span>
      <span id="timer"></span>
      <span id="score"></span>
    </div>
    <div class="bar"><div id="fill"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <div id="explanation" class="exp hidden"></div>
    <button id="nextBtn" class="btn hidden">Next</button>
  </div>

  <div id="result" class="card hidden">
    <h2>Final score: <span id="finalScore"></span></h2>
    <p id="message"></p>
    <button id="restartBtn" class="btn">Restart</button>
    <button id="reviewBtn" class="btn">Review wrong answers</button>
    <div id="wrongList" class="hidden"></div>
  </div>
</main>

<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
