<html>
    <head>
        <title>Float Example</title>
        <style>
            #div1,#div2,#div3,#div4,#div5{
                height:200px;
                
            }
            #div1{
                float:left;
            }
            #div2{
                clear:left;
            }
            #div1,#div3,#div5{
                background-color:yellow;
            }
           
        </style>
    </head>
    <body>
       <div id="div1">Div1</div>
       <div id="div2">Div2</div>
       <div id="div3">Div3</div>
       <div id="div4">Div4</div>
       <div id="div5">Div5</div>
    </body>
</html>
