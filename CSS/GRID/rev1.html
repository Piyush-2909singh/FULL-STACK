<html>
    <head><style>
        .container{
            display:grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            
            outline: 1px solid black;

        }
        .container>div{
            outline:1px dashed black;
            font-size: 30px;
        }


        .container1{
            display:grid;
            grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
            
            outline: 1px solid black;

        }
        .container1>div{
            outline:1px dashed black;
            font-size: 30px;
        }
    </style>

    </head>
    <body>
        <div class="container">
            
           <div>1</div>
           <div>2</div>
           <div>3</div>
           <div>4</div>
            </div>
            
            
        </div>
        <div class="container1">
            
           <div>1</div>
           <div>2</div>
           <div>3</div>
           <div>4</div>
            </div>
            
            
        </div>
        </body>
</html>
