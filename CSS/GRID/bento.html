<html>
    <head>
       <style>
        .container{
            display:grid;
           
            
            outline: 5px solid black;
grid-template-areas:
"box1 box1 box2"
"box1 box1 box2"
"box3 box5 box7"
"box3 box6 box7"
"box4 box6 box7"

        }
        .container>div{
            outline:3px solid black;
            font-size: 30px;
        }


        .container1{
            display:grid;
            grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
            
            outline: 6px solid black;

        }
        .container1>div{
            outline:1px dashed black;
            font-size: 30px;
        }
    </style>

    </head>
    <body>
        <div class="container">
            
           
           <div style="grid-area:box1;" backgroundcolor="lightgray">1</div>
           <div style="grid-area:box2;" backgroundcolor="green">2</div>
           <div style="grid-area:box3;" backgroundcolor="red">3</div>
           <div style="grid-area:box4;" backgroundcolor="yellow">4</div>
           <div style="grid-area:box5;" backgroundcolor="cream">5</div>
           <div style="grid-area:box6;" backgroundcolor="orange">6</div>
           <div style="grid-area:box7;" backgroundcolor="blue">7</div>
           
            </div>
            
            
        </div>
               </body>
</html>
