<html lang="en"><head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Pokemon Generations</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            margin: 0;

            color: white;

            font-family: Georgia, "Times New Roman", serif;

            background:

                radial-gradient(
                    circle at 50% 20%,
                    rgba(30, 90, 180, 0.35),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 10% 80%,
                    rgba(220, 30, 40, 0.18),
                    transparent 30%
                ),

                #050914;

            min-height: 100vh;

        }


        /* =========================
           POKEBALL STYLE BACKGROUND
        ========================= */

        body::before {

            content: "";

            position: fixed;

            top: -250px;
            right: -250px;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            background:

                linear-gradient(
                    to bottom,
                    rgba(220, 30, 40, 0.18) 0%,
                    rgba(220, 30, 40, 0.18) 47%,
                    rgba(255, 255, 255, 0.08) 48%,
                    rgba(255, 255, 255, 0.08) 52%,
                    rgba(30, 70, 160, 0.15) 53%,
                    rgba(30, 70, 160, 0.15) 100%
                );

            border: 8px solid rgba(255, 255, 255, 0.05);

            z-index: -1;

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            display: flex;

            flex-direction: column;

            gap: 25px;

            width: 100%;

            min-height: 100vh;

            padding-bottom: 80px;

            background:

                radial-gradient(
                    circle at center,
                    rgba(20, 70, 140, 0.12),
                    transparent 50%
                );

        }


        /* =========================
           MAIN TITLE
        ========================= */

        h1 {

            text-align: center;

            text-transform: uppercase;

            font-size: 65px;

            padding: 30px 10px 40px;

            letter-spacing: 4px;

            color: #ffd92f;

            text-shadow:

                3px 3px 0 #2455a4,

                6px 6px 0 rgba(0, 0, 0, 0.8),

                0 0 25px rgba(255, 217, 47, 0.35);

        }


        /* =========================
           GENERATION BOX
        ========================= */

        .box {

            width: 80%;

            margin-left: 10%;

            height: 270px;

            position: sticky;

            top: 30px;

            overflow: hidden;

            background: #050914;

            border-radius: 12px;

            border: 2px solid rgba(255, 255, 255, 0.12);

            box-shadow:

                0 10px 35px rgba(0, 0, 0, 0.8),

                0 0 25px rgba(30, 90, 180, 0.15);

        }


        /* =========================
           GENERATION TITLE
        ========================= */

        .box p {

            height: 70px;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            z-index: 2;

            color: #ffffff;

            font-size: 48px;

            font-weight: 900;

            letter-spacing: 3px;

            text-transform: uppercase;

            background:

                linear-gradient(
                    90deg,
                    #14213d,
                    #183f7a,
                    #14213d
                );

            border-bottom: 3px solid #ffd92f;

            text-shadow:

                2px 2px 0 #000,

                0 0 12px rgba(255, 255, 255, 0.4);

        }


        /* =========================
           POKEMON IMAGE
        ========================= */

        .box img {

            width: 100%;

            height: 200px;

            display: block;

            object-fit: fill;

            opacity: 0.75;

            filter:

                saturate(0.9)

                contrast(1.05)

                brightness(0.8);

        }


        /* =========================
           RED POKEBALL LINE
        ========================= */

        .box::after {

            content: "";

            position: absolute;

            left: 0;

            right: 0;

            bottom: 0;

            height: 5px;

            background:

                linear-gradient(
                    90deg,
                    #e33535,
                    #ffd92f,
                    #3478d4
                );

            z-index: 5;

        }


        /* =========================
           DIFFERENT GENERATION COLORS
        ========================= */

        #box1 p {
            border-bottom-color: #e33535;
        }


        #box2 p {
            border-bottom-color: #3fc45c;
        }


        #box3 p {
            border-bottom-color: #f29b38;
        }


        #box4 p {
            border-bottom-color: #55aee8;
        }


        #box5 p {
            border-bottom-color: #78c850;
        }


        /* =========================
           HOVER EFFECT
        ========================= */

        .box:hover {

            transform: scale(1.01);

            box-shadow:

                0 15px 45px rgba(0, 0, 0, 0.9),

                0 0 30px rgba(50, 120, 220, 0.25);

        }


        .box:hover img {

            opacity: 0.9;

            filter:

                saturate(1.1)

                contrast(1.05)

                brightness(0.9);

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            h1 {

                font-size: 40px;

                letter-spacing: 2px;

            }


            .box {

                width: 90%;

                margin-left: 5%;

                height: 230px;

            }


            .box p {

                height: 60px;

                font-size: 30px;

            }


            .box img {

                height: 170px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>
            POKEMON GENERATION
        </h1>


        <!-- GENERATION 1 -->

        <div class="box" id="box1">

            <p>

            </p>

            <img src="C:\Users\lenovo\Downloads\OIP.webp" alt="Pokemon Generation 1">

        </div>


        <!-- GENERATION 3 -->

        </div>


        <!-- GENERATION 4 -->

        <div class="box" id="box4">

        </div>

        <div class="box" id="box5">

            <p>

</body></html>
