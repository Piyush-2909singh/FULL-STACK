<html>
    <head>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #f5f7fa;
                font-family: Arial, sans-serif;
            }

            input {
                width: 420px;
                padding: 10px 5px;
                margin: 12px 0;
                font-size: 28px;
                border-width: 0 0 2px 0;
                border-style: solid;
                border-color: black;
                outline: none;
                background-color: transparent;
                transition: 0.3s;
            }

            input:focus {
                border-color: #2563eb;
            }

            input:required {
                border-color: red;
            }

            input:optional {
                border-color: green;
            }

            input:disabled {
                border-color: transparent;
                background-color: grey;
                color: white;
            }

            input:read-only {
                background-color: #e5e7eb;
                color: #555;
            }

            input:in-range {
                color: green;
            }

            input:out-of-range {
                color: red;
            }

            button {
                margin-top: 15px;
                padding: 12px 25px;
                border: none;
                border-radius: 6px;
                background-color: #111827;
                color: white;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
                transition: 0.3s;
            }

            button:hover {
                background-color: #2563eb;
                transform: translateY(-2px);
            }

            button:not(:hover) {
                color: white;
            }

            button:active {
                transform: translateY(0);
            }

            /*
            form based pseudo class

            enabled
            disabled
            required
            optional
            read-only
            read-write
            valid
            invalid
            in-range
            out-of-range
            checked
            */
        </style>
    </head>

    <body>

        <form>

            <input type="text" placeholder="First Name" required><br>

            <input type="text" placeholder="MIDDLE Name"><br>

            <input type="text" placeholder="LAST Name" required><br>

            <input type="text" placeholder="MATHURA" readonly><br>

            <input type="number" min="10" max="100">

            <button type="submit">SUBMIT KRDE BHAI</button>

        </form>

    </body>
</html>
