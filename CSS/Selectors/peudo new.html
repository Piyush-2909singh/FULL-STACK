            /*
           :has
           :is
           :not
           :where
            */
            div:has(h1){
                background-color: black;
                color: white;
            }
            div:not(:has(h1)){
                background-color: aqua;
            }
        </style>
    </head>

    <body>
            <div><h1>FULL STACK KI CLASSES
                
            </h1></div>
