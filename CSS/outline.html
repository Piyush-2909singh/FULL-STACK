<html>
    <head>
        <title>Float Example</title>
        <style>
            #div1,#div2,#div3,#div4,#div5{
                height:200px;
                width:300px;   
                float:left;             
            }
            #div3{
                background-color: rgb(13, 255, 0);
            }
            #div5{
                background-color: yellow;
            }
            #div1{
                background-color: 
                rgb(0, 157, 255);
            }
            #div2{
                background-color: 
                rgb(242, 59, 68);
            }
            #div4{
                background-color: 
                rgb(195, 0, 255);
            }
            #div4{
                outline: 10px solid rgb(239, 10, 10);
            }
            #div3{
                outline: 10px solid rgb(138, 4, 255);
            }
            
           
        </style>
    </head>
    <body>
       <div id="div1">Div1</div>
       <div id="div2">Div2</div>
       <div id="div3">Div3</div>
       <div id="div4">Div4</div>
       <div id="div5">Div5</div>
    </body>
</html>
