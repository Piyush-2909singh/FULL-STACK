<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0
">
    <title>Document</title>
    <style>
.container{
    display:flex;
    justify-content:center;
    flex-direction:row;
    outline: 2px solid black;
    height:90vh;
    align-items:center;
    flex-wrap:no-wrap;
}

.container>div{
    background-color: black;
    color:white;
    height:100px;
    width:100px;
    align-content:center;
    text-align:center;

}

#box1{
    
    background-color: red;
}
#box2{
    
    background-color: green;
}
#box3{
    
    background-color: blue;
}

#box5{
    
    background-color: purple;
}
#box6{
    
    background-color: orange;
}
#box7{
    
    background-color: pink;
}

    </style>
    </head>
    <body>
        
        <div class="container">
            <div id="box1"> 1</div>
            <div id="box2"> 2</div>
            <div id="box3"> 3</div>
           <div id="box4"> 4</div>
            <div id="box5"> 5</div>
            <div id="box6"> 6</div>
            <div id="box7"> 7</div>
        </div>

    </body>
    </html>
</html>
